{% extends 'reviews/base.html' %}

{% block title %}
    	<title>Your Form</title>
{% endblock %}

{% block content %}
   <form action="/" method="POST">
        {% csrf_token %}
    {% for field in form %}
         <div class="form-control {% if form.field.errors %}error{% endif %}">
            {{ field.label_tag }}
            {{ field }}
            {{ field.errors }}
        </div>
    {%  endfor %}


        <button>Submıt</button>
    </form>
{% endblock %}
